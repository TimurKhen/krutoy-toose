<div class="container">
  <div class="header">
    <h3>Купить валюту</h3>
  </div>
  <div class="content">
    @if (paymentData()) {
      <h2>{{paymentData()!.title}}</h2>

      <button
        appClickEffect appClickReactionAnimation
        class="coin-btn"
      >
        <img alt="coin" class="image" ngSrc="coins/gold.png" fill priority>
        <img alt="coin" class="image-glow" src="coins/gold.png">
      </button>

      <div class="price">
        <span class="star-price">
          <h1>За {{paymentData()!.price}}</h1>
          <img src="icons/star.svg" width="24" height="24">
        </span>
        <p>{{Math.floor(paymentData()!.price / coeff)}} RUB</p>
      </div>

      <button>Оплатить</button>
    }
  </div>
</div>
