name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build -- --configuration=production --base-href=/krutoy-toose/

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/krutoy-toose/browser
          # Если сборка упадет с ошибкой "Path dist/krutoy-toose/browser does not exist",
          # значит у вас более старая версия Angular (до 17). 
          # В таком случае замените эту строку на: path: dist/krutoy-toose

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
